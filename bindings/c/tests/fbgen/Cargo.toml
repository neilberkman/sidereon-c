# Manual fixture generator for the C broadcast/fallback smoke test. Not part of
# the binding workspace (own empty [workspace] table), so a plain `cargo build` /
# `cargo test` of the binding never pulls it in. tests/run_generators.sh runs it
# to regenerate bindings/c/tests/broadcast_fixture.h:
#
#     cargo run --release --manifest-path bindings/c/tests/fbgen/Cargo.toml \
#         > bindings/c/tests/broadcast_fixture.h
#
# It reproduces the inputs of sidereon-core's own broadcast_spp_fallback_arc
# integration test (ESBC00DNK DOY177 GPS C1C first epoch) against the same
# sidereon-core revision tests/CORE_REVISION names and emits the engine-extracted
# observations plus the solve inputs as a C header, so the C smoke test feeds
# the binding the same inputs.
[package]
name = "fbgen"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Exact Git candidate engine source; tests/run_generators.sh verifies its locked
# provenance against tests/CORE_REVISION.
sidereon-core = { git = "https://github.com/neilberkman/sidereon", rev = "7ff9b0afb6c799fd7321f2743973a9d826a9932b" }
serde_json = "1"
