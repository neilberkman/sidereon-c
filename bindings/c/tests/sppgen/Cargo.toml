# Fixture generator for the C SPP smoke tests. Not part of the binding
# workspace (own empty [workspace] table), so a plain `cargo build` / `cargo
# test` of the binding never pulls it in. tests/run_generators.sh runs it from
# the binding root, then transcribes the result into the header:
#
#     cargo run --release --manifest-path tests/sppgen/Cargo.toml \
#         > tests/fixtures/spp_expected.json
#     python3 tests/gen_fixture_header.py
#
# It reads the inputs of sidereon-core's spp_trace_L0_minimal fixture, solves
# them with the engine's default SPP range model, and writes the solution's
# exact bits. The fixture's own final_solution pins a replay range model the
# engine keeps for its own tests, which a binding does not build.
[package]
name = "sppgen"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Exact Git candidate engine source; tests/run_generators.sh verifies its locked
# provenance against tests/CORE_REVISION.
sidereon-core = { git = "https://github.com/neilberkman/sidereon", rev = "7ff9b0afb6c799fd7321f2743973a9d826a9932b" }
serde_json = "1"
