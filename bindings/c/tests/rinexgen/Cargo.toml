# Manual fixture generator for the C RINEX-OBS smoke test. Own empty
# [workspace] so a plain binding build never pulls it in. tests/run_generators.sh
# runs it:
#
#     cargo run --release --manifest-path bindings/c/tests/rinexgen/Cargo.toml \
#         > bindings/c/tests/rinex_fixture.h
#
# It parses the committed reference .rnx (the crx2rnx-decoded ESBC obs file) via
# sidereon-core and emits the version, epoch count, and sampled observation
# values as a C header so the binding reproduces them bit-for-bit.
[package]
name = "rinexgen"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The sidereon-core revision tests/CORE_REVISION names; tests/run_generators.sh
# checks that every generator pins the same one.
sidereon-core = { version = "3.0.0", git = "https://github.com/neilberkman/sidereon", rev = "e2fb3dfdc392d23087ed8aa1ee028a0056b4021b" }
serde_json = "1"
