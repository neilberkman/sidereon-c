# Manual fixture generator for the C velocity smoke test. Not part of the
# binding workspace (own empty [workspace] table), so a plain `cargo build` /
# `cargo test` of the binding never pulls it in. tests/run_generators.sh runs it
# to regenerate bindings/c/tests/velocity_fixture.h:
#
#     cargo run --release --manifest-path bindings/c/tests/velgen/Cargo.toml \
#         > bindings/c/tests/velocity_fixture.h
#
# It reproduces sidereon-core's own velocity range_rate/doppler golden scenario
# (the velocity.rs module test) against the sidereon-core revision
# tests/CORE_REVISION names and emits the engine-synthesized observations plus the frozen solution
# as a C header.
[package]
name = "velgen"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The sidereon-core revision tests/CORE_REVISION names; tests/run_generators.sh
# checks that every generator pins the same one.
sidereon-core = { version = "3.0.0", git = "https://github.com/neilberkman/sidereon", rev = "e2fb3dfdc392d23087ed8aa1ee028a0056b4021b" }
serde_json = "1"
