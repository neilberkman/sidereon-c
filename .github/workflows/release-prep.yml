name: Release fixture preparation

on:
  push:
    branches: [release/3.0.2-20261005]
    paths:
      - '.github/workflows/release-prep.yml'
      - '.github/release-registry.patch'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bindings/c/Cargo.toml'
      - 'bindings/c/tests/CORE_REVISION'
      - 'bindings/c/tests/**/Cargo.toml'
      - 'bindings/c/tests/**/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Resolve registry locks and generate fixtures
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed registry metadata
        run: |
          git apply --check .github/release-registry.patch
          git apply .github/release-registry.patch
          git diff --check
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-fixture-prep
      - name: Install pinned cbindgen
        run: cargo install --locked cbindgen --version 0.29.4
      - name: Resolve published registry lockfiles
        shell: bash
        run: |
          manifests=(
            Cargo.toml
            bindings/c/tests/fbgen/Cargo.toml
            bindings/c/tests/pingen/Cargo.toml
            bindings/c/tests/rinexgen/Cargo.toml
            bindings/c/tests/rtkgen/Cargo.toml
            bindings/c/tests/sppgen/Cargo.toml
            bindings/c/tests/valgen/Cargo.toml
            bindings/c/tests/velgen/Cargo.toml
            bindings/c/tests/registry_fixture_harness/Cargo.toml
          )
          for manifest in "${manifests[@]}"; do
            cargo update --workspace --manifest-path "$manifest" --verbose
          done
      - name: Read the exact engine revision
        id: core
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < bindings/c/tests/CORE_REVISION)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CORE_REVISION is not one full Git commit" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the exact engine source
        uses: actions/checkout@v4
        with:
          repository: neilberkman/sidereon
          ref: ${{ steps.core.outputs.revision }}
          path: .sidereon-core
          sparse-checkout: crates/sidereon-core/tests
      - name: Regenerate all numerical fixtures
        env:
          SIDEREON_CORE_SOURCE: ${{ github.workspace }}/.sidereon-core
        working-directory: bindings/c
        run: ./tests/run_generators.sh
      - name: Regenerate the public header
        working-directory: bindings/c
        run: cbindgen --quiet --config cbindgen.toml --crate sidereon-c --output include/sidereon.h
      - name: Verify generated paths
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          metadata = {
              "Cargo.toml",
              "Cargo.lock",
              "bindings/c/Cargo.toml",
              "bindings/c/tests/CORE_REVISION",
          }
          generators = ("fbgen", "pingen", "rinexgen", "rtkgen", "sppgen", "valgen", "velgen")
          for name in generators:
              metadata.add(f"bindings/c/tests/{name}/Cargo.toml")
              metadata.add(f"bindings/c/tests/{name}/Cargo.lock")
          metadata.update({
              "bindings/c/tests/registry_fixture_harness/Cargo.toml",
              "bindings/c/tests/registry_fixture_harness/Cargo.lock",
          })
          expected_locks = {"Cargo.lock"}
          expected_locks.update(f"bindings/c/tests/{name}/Cargo.lock" for name in generators)
          expected_locks.add("bindings/c/tests/registry_fixture_harness/Cargo.lock")
          fixture = re.compile(
              r"^bindings/c/tests/(?:"
              r"fixtures/(?:spp_expected|ppp_esbc)\.json|"
              r"(?:antex|broadcast|constellation|dop|engine_pins|iono|ppp|prop|rinex|rtk|spp|velocity)_fixture\.h|"
              r"[^/]+_pins\.h"
              r")$"
          )
          unexpected = [
              path
              for path in changed
              if path not in metadata
              and path != "bindings/c/include/sidereon.h"
              and fixture.fullmatch(path) is None
          ]
          if unexpected:
              raise SystemExit(f"generator changed unexpected paths: {unexpected}")
          missing_locks = sorted(expected_locks.difference(changed))
          if missing_locks:
              raise SystemExit(f"registry resolution did not update locks: {missing_locks}")
          if not any(fixture.fullmatch(path) for path in changed):
              raise SystemExit("generator produced no fixture changes")
          PY
          git diff --check
      - name: Assemble review artifact
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/sidereon-c-release-prep
        run: |
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          artifact = Path(os.environ["ARTIFACT_ROOT"])
          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          header = "bindings/c/include/sidereon.h"
          metadata = [
              "Cargo.toml",
              "Cargo.lock",
              "bindings/c/Cargo.toml",
              "bindings/c/tests/CORE_REVISION",
              "bindings/c/tests/registry_fixture_harness/Cargo.toml",
              "bindings/c/tests/registry_fixture_harness/Cargo.lock",
          ]
          for generator in ("fbgen", "pingen", "rinexgen", "rtkgen", "sppgen", "valgen", "velgen"):
              metadata.append(f"bindings/c/tests/{generator}/Cargo.toml")
              metadata.append(f"bindings/c/tests/{generator}/Cargo.lock")
          for name in sorted(set(changed + [header] + metadata)):
              source = Path(name)
              target = artifact / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          (artifact / "changed-files.txt").write_text("\n".join(changed) + "\n")
          PY
          git diff --binary > "$ARTIFACT_ROOT/generated.patch"
          cp "$RUNNER_TEMP/sidereon-c-generator-provenance.json" \
            "$ARTIFACT_ROOT/generation-context.json"
          git diff --stat | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload generated fixtures and header
        uses: actions/upload-artifact@v4
        with:
          name: sidereon-c-3.0.2-generated-${{ github.sha }}
          path: ${{ runner.temp }}/sidereon-c-release-prep
          if-no-files-found: error
          retention-days: 14
