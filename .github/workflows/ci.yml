name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A workflow file can be valid YAML and still be a broken workflow - a
  # branch filter on workflow_call parses fine and then fails the run in 0s
  # with no useful message. Lint the workflows themselves.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@3a24062651993d40fed1019b58ac6fbdfbf276cc # v2.0.1
        with:
          flags: "-shellcheck= -pyflakes="

  test:
    name: cargo test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cbindgen
        run: cargo install --locked cbindgen --version 0.29.4
      - run: cargo build --workspace --verbose
      - name: Generated header and C ABI smoke
        run: ./bindings/c/tests/run_ci_smoke.sh
      # This focused binding contract is platform-independent and release-gates
      # the PROJ GTX loader, explicit arithmetic selector, and typed coordinate
      # failures on every supported CI host.
      - run: cargo test --workspace proj_vgridshift_binding --verbose
      # The 0-ULP parity tests are certified only for the pinned target
      # (macOS / Apple libm + Accelerate). Other libm/FMA implementations
      # legitimately differ in the last bits, so the test suite (which reads the
      # repo-local vendored fixtures) runs on macOS; other platforms get a build
      # check only.
      - run: cargo test --workspace --verbose
        if: runner.os == 'macOS'
